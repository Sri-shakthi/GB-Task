services:
  media:
    build: .
    restart: unless-stopped
    environment:
      MEDIA_PROCESSOR_SECRET: ${MEDIA_PROCESSOR_SECRET:?set this in .env}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - media
    environment:
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?set this in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
